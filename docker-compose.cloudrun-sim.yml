# Local simulation of GCP Cloud Run deployment
# Runs MongoDB, InsightMesh Backend, and LibreChat UI

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.0-flash}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8443}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-default}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-true}
      - CHDB_PATH=/tmp/chdb_data
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - CREWAI_DISABLE_TELEMETRY=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - mongo-sim-data:/data/db

  librechat:
    build:
      context: .
      dockerfile: Dockerfile.librechat
    ports:
      - "3080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - BACKEND_URL=http://backend:8008
      - CREDS_KEY=f3ca3c5b36260f7572d559477c2554fe0ec4357c6661675b42b01a12e54d21b0
      - CREDS_IV=e6a394f1c3835cd79d1b1ff825029b38
      - JWT_SECRET=1618629f864f33b3a619047b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d
      - JWT_REFRESH_SECRET=7f4c0296b960518f8d689d7b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d
      - ALLOW_REGISTRATION=true
      - CHECK_EMAIL_VERIFICATION=false
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_started

volumes:
  mongo-sim-data:
