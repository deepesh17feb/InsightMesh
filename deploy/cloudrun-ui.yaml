apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: insightmesh-ui
  labels:
    cloud.googleapis.com/location: us-east1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/container-dependencies: '{"librechat":["mongodb"]}'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        # Ingress: LibreChat UI (Node.js)
        - name: librechat
          image: us-east1-docker.pkg.dev/gmec-developers-deepeshmw/insightmesh-docker/librechat:v3
          ports:
            - containerPort: 8080
              name: http1
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: MONGO_URI
              value: "mongodb://127.0.0.1:27017/LibreChat"
            - name: DOMAIN_CLIENT
              value: "http://localhost:8080"
            - name: DOMAIN_SERVER
              value: "http://localhost:8080"
            - name: CONFIG_PATH
              value: "/app/librechat.yaml"
            - name: CREDS_KEY
              value: "f34be4b067d5e49339e1a90d4e9c70a82b3a1a9a8b1c4e7f8a9b2c3d4e5f6a7b"
            - name: CREDS_IV
              value: "e6a394f1c3835cd79d1b1ff825029b38"
            - name: JWT_SECRET
              value: "1618629f864f33b3a619047b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d"
            - name: JWT_REFRESH_SECRET
              value: "7f4c0296b960518f8d689d7b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d"
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: ALLOW_UNVERIFIED_EMAIL_LOGIN
              value: "true"
            - name: CHECK_EMAIL_VERIFICATION
              value: "false"
            - name: LOGIN_MAX
              value: "1000"
            - name: LOGIN_WINDOW
              value: "1"
            - name: REGISTER_MAX
              value: "1000"
            - name: REGISTER_WINDOW
              value: "1"
            - name: TRUST_PROXY
              value: "1"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 25

        # Sidecar: MongoDB 7.0 (Local in-pod conversation database)
        - name: mongodb
          image: mongo:7.0
          args: ["--bind_ip_all"]
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          startupProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20

      volumes:
        - name: mongo-storage
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
