apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: insightmesh-backend
  labels:
    cloud.googleapis.com/location: us-east1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: backend
          image: us-east1-docker.pkg.dev/gmec-developers-deepeshmw/insightmesh-docker/backend:v3
          ports:
            - containerPort: 8008
              name: http1
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: CLICKHOUSE_HOST
              value: "fcpxr3rvgs.us-east1.gcp.clickhouse.cloud"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "ovM3fI.0K3F0Q"
            - name: CLICKHOUSE_PORT
              value: "8443"
            - name: CLICKHOUSE_SECURE
              value: "true"
            - name: CLICKHOUSE_DATABASE
              value: "atlys"
            - name: GEMINI_API_KEY
              value: "${GEMINI_API_KEY}"
            - name: LLM_PROVIDER
              value: "gemini"
            - name: LLM_MODEL
              value: "gemini/gemini-3-flash-preview"
            - name: LLM_TEMPERATURE
              value: "0"
            - name: LANGFUSE_SECRET_KEY
              value: "${LANGFUSE_SECRET_KEY}"
            - name: LANGFUSE_PUBLIC_KEY
              value: "${LANGFUSE_PUBLIC_KEY}"
            - name: LANGFUSE_BASE_URL
              value: "https://us.cloud.langfuse.com"
            - name: LANGFUSE_HOST
              value: "https://us.cloud.langfuse.com"
            - name: CHDB_PATH
              value: "/tmp/chdb_data"
            - name: CREWAI_DISABLE_TELEMETRY
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8008
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 8
