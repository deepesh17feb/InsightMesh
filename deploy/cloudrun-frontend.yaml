apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: insightmesh-frontend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/container-dependencies: '{"librechat":["mongodb"]}'
    spec:
      containers:
        - name: librechat
          image: REGION-docker.pkg.dev/PROJECT_ID/insightmesh-docker/librechat:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: MONGO_URI
              value: "mongodb://127.0.0.1:27017/LibreChat"
            - name: BACKEND_URL
              value: "${BACKEND_SERVICE_URL}"
            - name: CREDS_KEY
              value: "f3ca3c5b36260f7572d559477c2554fe0ec4357c6661675b42b01a12e54d21b0"
            - name: CREDS_IV
              value: "e6a394f1c3835cd79d1b1ff825029b38"
            - name: JWT_SECRET
              value: "1618629f864f33b3a619047b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d"
            - name: JWT_REFRESH_SECRET
              value: "7f4c0296b960518f8d689d7b40d3d4919bc335f8b3824ef75249b1a2e5c97a6d"
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: CHECK_EMAIL_VERIFICATION
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 8

        - name: mongodb
          image: mongo:7.0
          args: ["--bind_ip", "127.0.0.1"]
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 6

      volumes:
        - name: mongo-storage
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
