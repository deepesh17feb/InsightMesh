[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlys-agentic"
version = "0.1.0"
description = "Atlys Agentic Analytics System"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = {text = "Proprietary"}
dependencies = [
    "crewai>=1.15.0",
    "clickhouse-connect>=0.7.0",
    "chdb>=4.2.1",
    "litellm>=1.50.0",
    "langfuse>=4.0.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
atlys_agentic = ["config/*.yaml"]
