services:
  - type: web
    name: insightmesh-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8008"
      - key: CLICKHOUSE_HOST
        value: fcpxr3rvgs.us-east1.gcp.clickhouse.cloud
      - key: CLICKHOUSE_USER
        value: default
      - key: CLICKHOUSE_PASSWORD
        sync: false
      - key: CLICKHOUSE_PORT
        value: "8443"
      - key: CLICKHOUSE_SECURE
        value: "true"
      - key: CLICKHOUSE_DATABASE
        value: atlys
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini/gemini-3-flash-preview
      - key: LLM_TEMPERATURE
        value: "0"
      - key: CHDB_PATH
        value: /tmp/chdb_data
      - key: CREWAI_DISABLE_TELEMETRY
        value: "true"
