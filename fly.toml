app = "insightmesh-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[http_service]
  internal_schema = "http"
  internal_port = 8008
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[env]
  PORT = "8008"
  CLICKHOUSE_HOST = "fcpxr3rvgs.us-east1.gcp.clickhouse.cloud"
  CLICKHOUSE_USER = "default"
  CLICKHOUSE_PORT = "8443"
  CLICKHOUSE_SECURE = "true"
  CLICKHOUSE_DATABASE = "atlys"
  LLM_PROVIDER = "gemini"
  LLM_MODEL = "gemini/gemini-3-flash-preview"
  LLM_TEMPERATURE = "0"
  CHDB_PATH = "/tmp/chdb_data"
  CREWAI_DISABLE_TELEMETRY = "true"
